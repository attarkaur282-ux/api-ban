<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack API | SATVIR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1a, #03060c);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(20, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid #0ff;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }
        h1 {
            text-align: center;
            color: #0ff;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .sub {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 12px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
        }
        input {
            background: #0d111c;
            color: #fff;
            border: 1px solid #2a3a5a;
        }
        button {
            background: linear-gradient(90deg, #0ff, #0b7aff);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px #0ff;
        }
        .result {
            background: #050a12;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #0ff;
            font-size: 12px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #0d111c;
            cursor: pointer;
            border-radius: 10px;
        }
        .tab.active {
            background: #0ff;
            color: #000;
        }
        .hide {
            display: none;
        }
        hr {
            border-color: #0ff3;
            margin: 15px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💀 ATTACK API 💀</h1>
    <div class="sub">Created by SATVIR | Educational Purpose Only</div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('login')">Login</div>
        <div class="tab" onclick="showTab('register')">Register</div>
        <div class="tab" onclick="showTab('attack')">Attack</div>
    </div>

    <!-- Login Tab -->
    <div id="loginTab">
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="login()">🔐 Login</button>
    </div>

    <!-- Register Tab -->
    <div id="registerTab" class="hide">
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password">
        <button onclick="register()">📝 Register</button>
    </div>

    <!-- Attack Tab -->
    <div id="attackTab" class="hide">
        <input type="text" id="targetUrl" placeholder="Target URL (https://example.com)">
        <input type="text" id="attackToken" placeholder="Your Token (from login)">
        <button onclick="attack()">💀 START ATTACK 💀</button>
        <hr>
        <button onclick="checkStatus()">📊 Check Status</button>
    </div>

    <div class="result" id="result">Ready. Login or Register to start.</div>
</div>

<script>
    const API_BASE = window.location.origin;

    function showTab(tab) {
        document.getElementById('loginTab').classList.add('hide');
        document.getElementById('registerTab').classList.add('hide');
        document.getElementById('attackTab').classList.add('hide');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        if (tab === 'login') {
            document.getElementById('loginTab').classList.remove('hide');
            document.querySelectorAll('.tab')[0].classList.add('active');
        } else if (tab === 'register') {
            document.getElementById('registerTab').classList.remove('hide');
            document.querySelectorAll('.tab')[1].classList.add('active');
        } else if (tab === 'attack') {
            document.getElementById('attackTab').classList.remove('hide');
            document.querySelectorAll('.tab')[2].classList.add('active');
        }
    }

    async function register() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value.trim();
        
        if (!username || !password) {
            document.getElementById('result').innerHTML = '❌ Username and password required';
            return;
        }
        
        const res = await fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
        
        if (data.status === 'success') {
            document.getElementById('regUser').value = '';
            document.getElementById('regPass').value = '';
        }
    }

    async function login() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value.trim();
        
        if (!username || !password) {
            document.getElementById('result').innerHTML = '❌ Username and password required';
            return;
        }
        
        const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
        
        if (data.token) {
            localStorage.setItem('token', data.token);
            document.getElementById('attackToken').value = data.token;
        }
    }

    async function attack() {
        const target = document.getElementById('targetUrl').value.trim();
        const token = document.getElementById('attackToken').value.trim();
        
        if (!target) {
            document.getElementById('result').innerHTML = '❌ Target URL required';
            return;
        }
        if (!token) {
            document.getElementById('result').innerHTML = '❌ Token required. Login first.';
            return;
        }
        
        const res = await fetch(`${API_BASE}/attack?token=${token}&target=${encodeURIComponent(target)}`);
        const data = await res.json();
        document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
    }

    async function checkStatus() {
        const token = document.getElementById('attackToken').value.trim() || localStorage.getItem('token');
        if (!token) {
            document.getElementById('result').innerHTML = '❌ No token found. Login first.';
            return;
        }
        
        const res = await fetch(`${API_BASE}/status?token=${token}`);
        const data = await res.json();
        document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
    }

    // Load saved token
    const savedToken = localStorage.getItem('token');
    if (savedToken) {
        document.getElementById('attackToken').value = savedToken;
    }
</script>
</body>
</html>
